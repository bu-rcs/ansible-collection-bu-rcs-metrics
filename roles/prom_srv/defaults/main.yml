prom_srv_instance: "rcs"
prom_srv_name: "{{ prom_srv_instance }}-prometheus"
prom_srv_network: "{{ prom_srv_name }}"
prom_srv_dir: "/srv/{{ prom_srv_instance }}-prometheus"
prom_srv_image: "docker.io/prom/prometheus:v3.13.2"
prom_srv_hostbind: "127.0.0.1"
prom_srv_port_ext: "9090"
prom_srv_port_int: "9090"
prom_srv_ports:
  - "{{ prom_srv_hostbind }}:{{ prom_srv_port_ext }}:{{ prom_srv_port_int }}"
prom_srv_retention: 180d
prom_srv_max_size: 400GB
# if need emergency repair set: prom_srv_extra_flags:"--web.enable-admin-api"
prom_srv_extra_flags: ""

# Config
# Dicts merge (recursive), lists replace.
prom_srv_cfg_global_def:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    prometheus: "{{ inventory_hostname }}"
  sample_limit: 20000
  label_limit: 30
  label_name_length_limit: 128
  label_value_length_limit: 512

prom_srv_cfg_global_extra: {}
prom_srv_cfg_join_label: rcs_device

# Scrape jobs, keyed by job_name. Values are Prometheus-native scrape_config
# dicts — absent keys simply don't render. Dicts merge recursively with
# prom_srv_cfg_jobs_extra; lists replace.
prom_srv_cfg_jobs_def:
  prometheus:
    static_configs:
      - targets: ["localhost:9090"]

  node:
    scrape_interval: 30s
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node.json"]
  nvidia_gpu:
    scrape_interval: 60s
    file_sd_configs:
      - files: ["/etc/prometheus/targets/nvidia_gpu.json"]

  snmp:
    scrape_interval: 2m
    scrape_timeout: 60s
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [public_v2]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/snmp.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: rcs-snmp-exporter:9116

prom_srv_cfg_jobs_extra: {}

prom_srv_cfg_rules: []

prom_srv_cfg_cleanup: false

# Device inventory. Keyed on rcs_device (the join key, usually FQDN).
#   labels        become real labels on every sample from that device
#   exporters     which scrape jobs this device appears in
#   target_labels per-exporter target overrides (__param_*, __address__, ...)
prom_srv_cfg_devices: {}

# Every device's labels dict must contain all of these.
prom_srv_cfg_required_labels:
  - rcs_kind
  - rcs_role
  - rcs_service

# Port each exporter listens on. Omit for proxied exporters (snmp) — the
# target is then a bare rcs_device and the relabel chain supplies __address__.
prom_srv_cfg_exporter_ports:
  node: 9100
  nvidia_gpu: 9835
